name: Bot 2 - Auto-Stop Backfill Sync

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: backfill-archive-bot
  cancel-in-progress: false

jobs:
  backfill-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Bot 2 (Backfill -> Optimizer -> Turso, Auto-Stops on Completion)
        env:
          TG_ARCHIVE_TOKEN: ${{ secrets.TG_ARCHIVE_TOKEN }}
          TURSO_CATALOG_URL: ${{ secrets.TURSO_CATALOG_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          BACKFILL_PAGES_PER_RUN: '25'
        run: node scripts/bot_backfill.mjs
